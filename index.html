<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部活動活動記録アプリ</title>
    <!-- Favicon 404エラー防止用のインラインSVGファビコン -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- ヘッダー / ナビゲーションバー -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                <h1 class="text-xl font-bold tracking-wide">部活動活動記録ノート</h1>
            </div>
            
            <!-- ユーザープロファイル / ログインボタンエリア -->
            <div id="authContainer" class="flex items-center space-x-3">
                <div class="animate-pulse flex space-x-2 items-center">
                    <div class="w-8 h-8 bg-indigo-400 rounded-full"></div>
                    <div class="w-16 h-4 bg-indigo-400 rounded"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：新規投稿フォーム -->
        <section class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit lg:sticky lg:top-20">
            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center border-b pb-2">
                <svg class="w-5 h-5 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                新しい活動を記録
            </h2>

            <form id="recordForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1" for="activityDate">日付</label>
                    <input type="date" id="activityDate" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1" for="clubCategory">部活名・部門</label>
                    <select id="clubCategory" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="野球部">野球部</option>
                        <option value="サッカー部">サッカー部</option>
                        <option value="バスケットボール部">バスケットボール部</option>
                        <option value="吹奏楽部">吹奏楽部</option>
                        <option value="美術部">美術部</option>
                        <option value="パソコン部">パソコン部</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1" for="activityTitle">タイトル / 目標</label>
                    <input type="text" id="activityTitle" placeholder="例: 練習試合結果・改善点" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1" for="activityContent">活動内容・反省・メモ</label>
                    <textarea id="activityContent" rows="4" placeholder="本日のメニューや気づいた点を入力..." required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition duration-150 flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    <span>記録を保存する</span>
                </button>
            </form>
        </section>

        <!-- 右側：記録タイムライン -->
        <section class="lg:col-span-2 space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 flex items-center">
                    <svg class="w-5 h-5 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    活動記録一覧
                </h2>
                <div class="text-xs text-slate-500" id="recordCount">0 件の記録</div>
            </div>

            <!-- 未ログイン時の案内表示 -->
            <div id="loggedOutNotice" class="hidden bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-center">
                <svg class="w-8 h-8 text-amber-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="font-bold">Googleログインが必要です</p>
                <p class="text-sm">活動記録の書き込みおよび閲覧を行うには、右上のボタンからGoogleでログインしてください。</p>
            </div>

            <!-- 記録リストコンテナ -->
            <div id="recordsContainer" class="space-y-4">
                <div class="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200">
                    <svg class="w-8 h-8 animate-spin mx-auto mb-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <p class="text-sm">データを読み込み中...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- フッター -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-500">
            &copy; 部活動活動記録アプリ - GitHub Pages & Firebase
        </div>
    </footer>

    <!-- カスタム通知・確認モーダル -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-xl transform transition-all text-center">
            <div id="modalIcon" class="flex justify-center mb-3"></div>
            <h3 id="modalTitle" class="text-lg font-bold mb-2"></h3>
            <p id="modalMessage" class="text-sm text-slate-600 mb-5"></p>
            
            <div id="modalButtons" class="flex justify-center space-x-3">
                <button id="modalCloseBtn" class="bg-indigo-600 text-white font-medium py-2 px-6 rounded-lg hover:bg-indigo-700">OK</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Script Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            deleteDoc, 
            doc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. Firebase設定オブジェクト（ユーザー指定）
        const firebaseConfig = {
            apiKey: "AIzaSyCZWHfkwZyKJujuRWktvxxsV07SuFPW8Os",
            authDomain: "tuisi-1ea88.firebaseapp.com",
            projectId: "tuisi-1ea88",
            storageBucket: "tuisi-1ea88.firebasestorage.app",
            messagingSenderId: "394807005519",
            appId: "1:394807005519:web:ee60090b0b03ffe283f53a",
            measurementId: "G-NDR60G127D"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // アプリID定義 (Firestoreパス用)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'club-activities-app';

        // グローバルな状態管理
        let currentUser = null;
        let unsubscribeRecords = null;

        // DOM要素の参照
        const authContainer = document.getElementById('authContainer');
        const recordForm = document.getElementById('recordForm');
        const recordsContainer = document.getElementById('recordsContainer');
        const loggedOutNotice = document.getElementById('loggedOutNotice');
        const recordCount = document.getElementById('recordCount');
        const activityDateInput = document.getElementById('activityDate');
        const submitBtn = document.getElementById('submitBtn');

        // 今日の日付を初期値としてセット
        activityDateInput.value = new Date().toISOString().split('T')[0];

        function showModal(title, message, iconType = 'info', onConfirm = null) {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            const modalButtons = document.getElementById('modalButtons');

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            if (iconType === 'success') {
                modalIcon.innerHTML = `<svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else if (iconType === 'error') {
                modalIcon.innerHTML = `<svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else if (iconType === 'confirm') {
                modalIcon.innerHTML = `<svg class="w-12 h-12 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
            } else {
                modalIcon.innerHTML = `<svg class="w-12 h-12 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            if (onConfirm) {
                modalButtons.innerHTML = `
                    <button id="modalCancelBtn" class="bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg hover:bg-slate-300">キャンセル</button>
                    <button id="modalConfirmBtn" class="bg-red-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-red-700">削除する</button>
                `;
                document.getElementById('modalCancelBtn').onclick = closeModal;
                document.getElementById('modalConfirmBtn').onclick = () => {
                    closeModal();
                    onConfirm();
                };
            } else {
                modalButtons.innerHTML = `<button id="modalCloseBtn" class="bg-indigo-600 text-white font-medium py-2 px-6 rounded-lg hover:bg-indigo-700">OK</button>`;
                document.getElementById('modalCloseBtn').onclick = closeModal;
            }

            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modalOverlay');
            modalOverlay.classList.add('hidden');
            modalOverlay.classList.remove('flex');
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // ログイン時UI
                authContainer.innerHTML = `
                    <div class="flex items-center space-x-2 sm:space-x-3">
                        <img src="${user.photoURL || 'https://via.placeholder.com/32'}" alt="${escapeHtml(user.displayName)}" class="w-8 h-8 rounded-full border-2 border-white shadow-sm">
                        <span class="text-xs sm:text-sm font-medium hidden sm:inline">${escapeHtml(user.displayName)}</span>
                        <button id="logoutBtn" class="bg-indigo-700 hover:bg-indigo-800 text-xs text-white px-2.5 py-1.5 rounded-lg transition flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            ログアウト
                        </button>
                    </div>
                `;
                document.getElementById('logoutBtn').addEventListener('click', handleLogout);
                loggedOutNotice.classList.add('hidden');
                submitBtn.disabled = false;

                // リアルタイムリスト同期の開始
                subscribeToRecords();
            } else {
                // 未ログイン時UI
                authContainer.innerHTML = `
                    <button id="loginBtn" class="bg-white text-indigo-600 hover:bg-slate-100 font-bold text-xs sm:text-sm px-3 py-2 rounded-lg transition shadow-sm flex items-center">
                        <svg class="w-4 h-4 mr-1.5 text-red-500" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/>
                        </svg>
                        Googleでログイン
                    </button>
                `;
                document.getElementById('loginBtn').addEventListener('click', handleLogin);
                loggedOutNotice.classList.remove('hidden');
                submitBtn.disabled = true;

                // 解除処理と初期画面リセット
                if (unsubscribeRecords) unsubscribeRecords();
                recordsContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200">
                        <svg class="w-8 h-8 mx-auto mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <p class="text-sm">ログインすると記録を閲覧・投稿できます</p>
                    </div>
                `;
                recordCount.textContent = '0 件の記録';
            }
        });

        // ログイン処理
        async function handleLogin() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                if (error.code === 'auth/unauthorized-domain') {
                    showModal("認証エラー", "Firebase Consoleでドメイン(saa25001-prog.github.io)が登録されていません。Authentication > 設定 > 承認済みドメイン に追加してください。", "error");
                } else {
                    showModal("ログイン失敗", "Googleログインに失敗しました: " + error.message, "error");
                }
            }
        }

        // ログアウト処理
        async function handleLogout() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error:", error);
                showModal("エラー", "ログアウト時にエラーが発生しました", "error");
            }
        }

        recordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showModal("認証エラー", "記録を作成するにはログインが必要です", "error");
                return;
            }

            const date = document.getElementById('activityDate').value;
            const category = document.getElementById('clubCategory').value;
            const title = document.getElementById('activityTitle').value;
            const content = document.getElementById('activityContent').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>保存中...</span>
            `;

            try {
                // ルールに則った公開パス: /artifacts/{appId}/public/data/{collectionName}
                const publicColRef = collection(db, 'artifacts', appId, 'public', 'data', 'club_records');
                
                await addDoc(publicColRef, {
                    date: date,
                    category: category,
                    title: title,
                    content: content,
                    authorName: currentUser.displayName || '匿名部員',
                    authorId: currentUser.uid,
                    authorPhoto: currentUser.photoURL || '',
                    createdAt: serverTimestamp()
                });

                // フォームの初期化
                document.getElementById('activityTitle').value = '';
                document.getElementById('activityContent').value = '';
                showModal("完了", "活動記録を保存しました", "success");
            } catch (error) {
                console.error("Save Error:", error);
                showModal("保存失敗", "データの保存中にエラーが発生しました: " + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    <span>記録を保存する</span>
                `;
            }
        });

        function subscribeToRecords() {
            const publicColRef = collection(db, 'artifacts', appId, 'public', 'data', 'club_records');

            unsubscribeRecords = onSnapshot(publicColRef, (snapshot) => {
                const records = [];
                snapshot.forEach((docSnap) => {
                    records.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                // JS側で日付降順ソート
                records.sort((a, b) => new Date(b.date) - new Date(a.date));

                renderRecords(records);
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                recordsContainer.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center">
                        <p class="font-bold">データの取得に失敗しました</p>
                        <p class="text-xs">${error.message}</p>
                    </div>
                `;
            });
        }

        // 記録リストの描画
        function renderRecords(records) {
            recordCount.textContent = `${records.length} 件の記録`;

            if (records.length === 0) {
                recordsContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200">
                        <svg class="w-8 h-8 mx-auto mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
                        </svg>
                        <p class="text-sm">まだ活動記録が登録されていません</p>
                    </div>
                `;
                return;
            }

            recordsContainer.innerHTML = records.map(item => {
                const isOwner = currentUser && currentUser.uid === item.authorId;
                return `
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                    ${escapeHtml(item.category)}
                                </span>
                                <span class="text-xs text-slate-500 font-medium flex items-center">
                                    <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${escapeHtml(item.date)}
                                </span>
                            </div>
                            ${isOwner ? `
                                <button onclick="deleteRecord('${item.id}')" class="text-slate-400 hover:text-red-500 text-xs p-1 rounded transition" title="削除">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            ` : ''}
                        </div>

                        <h3 class="text-base font-bold text-slate-800 mb-2">${escapeHtml(item.title)}</h3>
                        <p class="text-sm text-slate-600 whitespace-pre-line mb-4 leading-relaxed">${escapeHtml(item.content)}</p>

                        <div class="flex items-center justify-between border-t border-slate-100 pt-3 text-xs text-slate-500">
                            <div class="flex items-center space-x-2">
                                <img src="${item.authorPhoto || 'https://via.placeholder.com/20'}" class="w-5 h-5 rounded-full">
                                <span>${escapeHtml(item.authorName)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.deleteRecord = (docId) => {
            if (!currentUser) return;

            showModal(
                "確認", 
                "この活動記録を削除してもよろしいですか？", 
                "confirm", 
                async () => {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'club_records', docId);
                        await deleteDoc(docRef);
                        showModal("削除完了", "活動記録を削除しました", "success");
                    } catch (error) {
                        console.error("Delete Error:", error);
                        showModal("削除エラー", "削除権限がないかエラーが発生しました", "error");
                    }
                }
            );
        };

        // HTMLエスケープヘルパー
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
